<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X1 Live - Corrida</title>
    <link rel="stylesheet" href="./styles/base.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Corrida X1 Live">
      <canvas id="race-canvas" width="1080" height="1080"></canvas>

      <section id="test-controls" aria-label="Controles de teste">
        <label>
          Seed
          <input id="seed-input" type="number" min="1" max="2147483647" />
        </label>
        <label>
          Velocidade
          <select id="speed-input">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <button id="restart-button" type="button">Rodar seed</button>
        <button id="random-button" type="button">Nova seed</button>
      </section>

      <output id="status" aria-live="polite"></output>
    </main>

    <script src="./config.js"></script>
    <script src="./vendor/matter.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
